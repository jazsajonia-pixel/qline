name: release

# Builds a signed APK and publishes a GitHub release when a v* tag is pushed.
# The upload key lives only in repository secrets (QLINE_KEYSTORE_BASE64, QLINE_KEYSTORE_PASSWORD, QLINE_KEY_ALIAS).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Read version from pubspec
        id: v
        run: |
          full=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${full%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${full##*+}" >> "$GITHUB_OUTPUT"
          test "v${full%%+*}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match pubspec ${full}"; exit 1; }
      - name: Write signing config
        env:
          KS: ${{ secrets.QLINE_KEYSTORE_BASE64 }}
          PW: ${{ secrets.QLINE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.QLINE_KEY_ALIAS }}
        run: |
          test -n "$KS" || { echo "Signing secrets are missing"; exit 1; }
          echo "$KS" | base64 -d > android/app/qline-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=qline-release.jks\n' "$PW" "$PW" "$ALIAS" > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=QLINE_VERSION=${{ steps.v.outputs.name }} --dart-define=QLINE_BUILD=${{ steps.v.outputs.code }}
      - name: Check signature and checksum
        id: sig
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          out=qline-${{ steps.v.outputs.name }}.apk
          cp "$apk" "$out"
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$signer" verify --print-certs "$out" | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "Signing certificate SHA-256: $cert"
          test "$cert" = "042819cb6c736b743c2134c91fab74beeba2edddbc2bc07e4c9def969ac288c1" || { echo "APK is not signed with the Qline release key"; exit 1; }
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$out" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          rm -f android/app/qline-release.jks android/key.properties
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          if [ -f "../../docs/releases/${GITHUB_REF_NAME}.md" ]; then cat "../../docs/releases/${GITHUB_REF_NAME}.md" > "$notes"; fi
          printf '\n\nAPK SHA-256: `%s`\nSigning certificate SHA-256: `%s`\n' "${{ steps.sig.outputs.sha }}" "${{ steps.sig.outputs.cert }}" >> "$notes"
          gh release create "$GITHUB_REF_NAME" "qline-${{ steps.v.outputs.name }}.apk" --title "Qline ${{ steps.v.outputs.name }}" --notes-file "$notes" --latest
