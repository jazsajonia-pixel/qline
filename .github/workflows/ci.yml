name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:api
      # Publish a short-lived deployment handoff branch because this repo's Actions artifact quota is full.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = `deploy/api-bundle-${context.sha.slice(0, 8)}`;
            const encoded = fs.readFileSync('services/api/dist/function.zip').toString('base64');
            const { data: commitInfo } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: encoded, encoding: 'utf-8' });
            const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: commitInfo.tree.sha, tree: [{ path: 'deploy-artifacts/qline-api-function.zip.b64', mode: '100644', type: 'blob', sha: blob.sha }] });
            const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: 'build: stage Qline API bundle for Neon deployment', tree: tree.sha, parents: [context.sha] });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
            core.info(`Staged API bundle on ${branch} (commit ${commit.sha}).`);

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned-by-upload-key build (falls back to debug keys) — proves the release build compiles.
      - run: flutter build apk --release --dart-define=QLINE_BUILD=${{ github.run_number }}

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production API health and v1.2.0 version
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://br-muddy-rain-a1uaplxr-api.compute.c-1.ap-southeast-1.aws.neon.tech/v1/health';
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          const body = await response.json();
          if (!response.ok || body.status !== 'ok' || body.version !== '1.2.0') {
            throw new Error(`Expected healthy Qline API v1.2.0, received HTTP ${response.status}: ${JSON.stringify(body)}`);
          }
          console.log(`Qline API healthy: v${body.version}`);
          NODE
