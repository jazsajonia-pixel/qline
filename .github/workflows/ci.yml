name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:api
      # Publish a short-lived deployment handoff branch because this repo's Actions artifact quota is full.
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = `deploy/api-bundle-${context.sha.slice(0, 8)}`;
            const encoded = fs.readFileSync('services/api/dist/function.zip').toString('base64');
            const { data: commitInfo } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: encoded, encoding: 'utf-8' });
            const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: commitInfo.tree.sha, tree: [{ path: 'deploy-artifacts/qline-api-function.zip.b64', mode: '100644', type: 'blob', sha: blob.sha }] });
            const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: 'build: stage Qline API bundle for Neon deployment', tree: tree.sha, parents: [context.sha] });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
            core.info(`Staged API bundle on ${branch} (commit ${commit.sha}).`);

  mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned-by-upload-key build (falls back to debug keys) — proves the release build compiles.
      - run: flutter build apk --release --dart-define=QLINE_BUILD=${{ github.run_number }}
      - name: Stage QA APK for physical-device testing
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/pr10-physical-device-build'
        # The APK (~57 MB) exceeds the REST blob API limit and the Actions artifact quota is full,
        # so it is pushed with git to a unique QA-only branch. No release, tag or deploy is created.
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ls "$ANDROID_HOME/build-tools"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          BT="${BT%/}"
          echo "Using build-tools at $BT"
          APK=build/app/outputs/flutter-apk/app-release.apk
          OUT="$RUNNER_TEMP/qa-artifacts"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/qline-pr10-physical-test.apk"
          (cd "$OUT" && sha256sum qline-pr10-physical-test.apk > qline-pr10-physical-test.apk.sha256)
          APK_SHA="$(cut -d' ' -f1 "$OUT/qline-pr10-physical-test.apk.sha256")"
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" || { cat "$RUNNER_TEMP/badging.txt"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt" || { cat "$RUNNER_TEMP/certs.txt"; exit 1; }
          BADGING="$(grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):" "$RUNNER_TEMP/badging.txt" || true)"
          CERTS="$(grep -E "certificate (DN|SHA-256)" "$RUNNER_TEMP/certs.txt" || true)"
          echo "$BADGING"; echo "$CERTS"
          grep -q "package: name='app.qline.qline.qa'" <<<"$BADGING" || { echo "QA APK must use app.qline.qline.qa"; exit 1; }
          grep -q "application-label:'Qline QA'" <<<"$BADGING" || { echo "QA APK must be labelled Qline QA"; exit 1; }
          if grep -qi "042819cb6c736b743c2134c91fab74beeba2edddbc2bc07e4c9def969ac288c1" <<<"$(tr -d ':' <<<"$CERTS")"; then
            echo "QA APK must not be signed with the production release key"; exit 1
          fi
          {
            echo "# Qline PR #10 physical QA build"
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- Workflow run: $RUN_ID (attempt $RUN_ATTEMPT)"
            echo "- APK SHA-256: $APK_SHA"
            echo "- Signing: CI debug key; QA-only, not a release APK, cannot update the production app."
            echo
            echo '```'
            echo "$BADGING"
            echo "$CERTS"
            echo '```'
          } > "$OUT/README.md"
          BRANCH="qa-artifacts/pr10-${SOURCE_SHA:0:8}-${RUN_ID}-${RUN_ATTEMPT}"
          cd "$OUT"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: stage PR10 physical QA APK from $SOURCE_SHA"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          echo "Staged QA APK on $BRANCH; SHA-256 $APK_SHA"

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production API health and readiness (v1.4.0)
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://br-muddy-rain-a1uaplxr-api.compute.c-1.ap-southeast-1.aws.neon.tech';
          const healthResponse = await fetch(`${base}/v1/health`, { signal: AbortSignal.timeout(15000) });
          const health = await healthResponse.json();
          if (!healthResponse.ok || health.status !== 'ok' || health.version !== '1.4.0') {
            throw new Error(`Expected healthy Qline API v1.4.0, received HTTP ${healthResponse.status}: ${JSON.stringify(health)}`);
          }
          const readyResponse = await fetch(`${base}/v1/health/ready`, { signal: AbortSignal.timeout(15000) });
          const ready = await readyResponse.json();
          if (!readyResponse.ok || ready.status !== 'ok' || ready.checks?.database !== true || ready.checks?.storage !== true) {
            throw new Error(`Qline API is not ready: HTTP ${readyResponse.status}: ${JSON.stringify(ready)}`);
          }
          console.log(`Qline API healthy and ready: v${health.version}`);
          NODE
