name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qline_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Configure isolated PostgreSQL integration environment
        run: |
          APP_DB_PASSWORD="$(openssl rand -hex 24)"
          AUTH_SECRET="$(openssl rand -hex 32)"
          DATA_KEY="$(openssl rand -hex 32)"
          {
            echo "APP_DATABASE_URL=postgresql://qline_app:${APP_DB_PASSWORD}@127.0.0.1:5432/qline_test"
            echo "BETTER_AUTH_SECRET=${AUTH_SECRET}"
            echo "QLINE_DATA_KEY=${DATA_KEY}"
            echo "NODE_ENV=test"
          } > .qline-test.env
          echo "DATABASE_URL_OWNER=postgresql://postgres@127.0.0.1:5432/qline_test" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=${APP_DB_PASSWORD}" >> "$GITHUB_ENV"
          echo "QLINE_TEST_ENV=$GITHUB_WORKSPACE/.qline-test.env" >> "$GITHUB_ENV"
      - name: Apply schema migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Verify least-privilege runtime role
        run: |
          role_flags="$(psql "$DATABASE_URL_OWNER" -AtF '|' -c "select rolsuper, rolbypassrls, rolcreaterole, rolcreatedb from pg_roles where rolname = 'qline_app'")"
          test "$role_flags" = "f|f|f|f"
          owned_tables="$(psql "$DATABASE_URL_OWNER" -Atc "select count(*) from pg_tables where schemaname = 'public' and tableowner = 'qline_app'")"
          test "$owned_tables" = "0"
      - name: Run API and durable-runtime database integration tests
        run: npm run test:integration -- --testTimeout=180000
      - run: npm run build:api
      # Publish a short-lived deployment handoff branch because this repo's Actions artifact quota is full.
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = `deploy/api-bundle-${context.sha.slice(0, 8)}`;
            const encoded = fs.readFileSync('services/api/dist/function.zip').toString('base64');
            const { data: commitInfo } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: encoded, encoding: 'utf-8' });
            const { data: tree } = await github.rest.git.createTree({ owner, repo, base_tree: commitInfo.tree.sha, tree: [{ path: 'deploy-artifacts/qline-api-function.zip.b64', mode: '100644', type: 'blob', sha: blob.sha }] });
            const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: 'build: stage Qline API bundle for Neon deployment', tree: tree.sha, parents: [context.sha] });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
            core.info(`Staged API bundle on ${branch} (commit ${commit.sha}).`);

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned-by-upload-key build (falls back to debug keys) — proves the release build compiles.
      - run: flutter build apk --release --dart-define=QLINE_BUILD=${{ github.run_number }}

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production API health and readiness (v1.4.0)
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://br-muddy-rain-a1uaplxr-api.compute.c-1.ap-southeast-1.aws.neon.tech';
          const healthResponse = await fetch(`${base}/v1/health`, { signal: AbortSignal.timeout(15000) });
          const health = await healthResponse.json();
          if (!healthResponse.ok || health.status !== 'ok' || health.version !== '1.4.0') {
            throw new Error(`Expected healthy Qline API v1.4.0, received HTTP ${healthResponse.status}: ${JSON.stringify(health)}`);
          }
          const readyResponse = await fetch(`${base}/v1/health/ready`, { signal: AbortSignal.timeout(15000) });
          const ready = await readyResponse.json();
          if (!readyResponse.ok || ready.status !== 'ok' || ready.checks?.database !== true || ready.checks?.storage !== true) {
            throw new Error(`Qline API is not ready: HTTP ${readyResponse.status}: ${JSON.stringify(ready)}`);
          }
          console.log(`Qline API healthy and ready: v${health.version}`);
          NODE
