name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:api
      - uses: actions/upload-artifact@v4
        with:
          name: qline-api-function-${{ github.sha }}
          path: services/api/dist/function.zip
          if-no-files-found: error
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned-by-upload-key build (falls back to debug keys) — proves the release build compiles.
      - run: flutter build apk --release --dart-define=QLINE_BUILD=${{ github.run_number }}
